name: Deploy TheKbCart

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/apps/TheKbCart

            git fetch origin
            git reset --hard origin/main

            cd backend
            npm install

            cd ../frontend
            npm install
            npm run build

            sudo rm -rf /var/www/thekbcart/*
            sudo cp -r dist/* /var/www/thekbcart/

            cd ../backend
            pm2 restart thekbcart-backend
            pm2 save